<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omnidesk · демо виджета</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 460px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Демо страница хоста</h1>
      <p>
        Это обычная страница сайта. Виджет чата подключён одним тегом и должен
        появиться в правом нижнем углу.
      </p>
    </div>

    <!-- Omnidesk live-chat widget (demo) -->
    <script
      src="/livechat.js"
      data-omnidesk-key="demo"
      data-omnidesk-title="Поддержка Omnidesk"
      data-omnidesk-greeting="Привет! Чем помочь?"
      defer
    ></script>
  </body>
</html>
